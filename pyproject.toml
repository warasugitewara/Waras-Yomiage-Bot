[project]
name = "waras-yomiage-bot"
version = "1.0.0"
description = "VOICEVOX を使った Discord 読み上げBot"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "discord.py[voice]>=2.7.1",
    "psutil>=5.9.0",
    "PyNaCl>=1.5.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
